<!doctype html>
<!-- ReverseCAD web app. Three screens (Capture, Search, Edit) are switched by app.js; styles live in
     tokens.css (variables) and app.css (layout). Open with ?run=<name>&step=capture|measure|search|edit
     to jump straight to a screen of a saved run (used for screenshots and recordings). -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ReverseCAD</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@500;600&display=swap">
  <link rel="stylesheet" href="/static/tokens.css">
  <link rel="stylesheet" href="/static/app.css">
  <!-- three.js from a CDN, pinned to one version -->
  <script type="importmap">
    {"imports": {"three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                 "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
  </script>
</head>
<body>
  <header class="topbar">
    <div class="brand">REVERSECAD</div>
    <nav class="steps" id="steps">
      <button data-screen="capture">1 Capture</button>
      <button data-screen="search" disabled>2 Search</button>
      <button data-screen="edit" disabled>3 Edit</button>
    </nav>
    <div class="topbar-status" id="topbar-status"></div>
  </header>

  <div class="workspace">
    <main class="stage">
      <div class="stage-bar" id="stage-bar"></div>
      <div class="stage-body">
        <p class="stage-empty" id="stage-empty">Upload a photo of the part next to a card, or try an example.</p>
        <canvas id="photo-canvas" class="hidden"></canvas>
        <div class="candidate-grid hidden" id="candidate-grid"></div>
        <div class="viewer hidden" id="viewer"></div>
      </div>
    </main>

    <aside class="inspector">
      <!-- Capture: photo, click, thickness, then the measurements -->
      <section class="panel" id="panel-capture">
        <h2>Capture</h2>
        <label class="dropzone">
          <input type="file" id="photo-upload" accept="image/*">
          <span class="dropzone-title">Upload a photo</span>
          <span class="hint">Part next to a bank or transit card, shot from straight above.</span>
        </label>
        <div class="examples">
          <span class="label">Try an example</span>
          <div class="example-list" id="example-list"></div>
        </div>
        <ol class="procedure">
          <li id="step-card"><span class="tick"></span>Card next to the part</li>
          <li id="step-click"><span class="tick"></span>Click the part in the photo</li>
          <li id="step-thickness"><span class="tick"></span>Part thickness</li>
        </ol>
        <div class="stepper">
          <button id="thickness-down" aria-label="thinner">−</button>
          <input type="text" id="thickness" value="3.0" inputmode="decimal" aria-label="thickness in mm">
          <span class="unit">mm</span>
          <button id="thickness-up" aria-label="thicker">+</button>
        </div>
        <button class="primary" id="analyze" disabled>Measure</button>
        <p class="hint" id="capture-status"></p>
        <label class="live-only hidden field">
          <span class="label">Candidates to ask for</span>
          <input type="number" id="candidate-count" value="5" min="1" max="10">
        </label>
        <button class="primary hidden" id="to-candidates">Reconstruct →</button>
        <div class="results hidden" id="measure-results">
          <span class="label">Measured</span>
          <table class="values" id="measure-table"></table>
        </div>
      </section>

      <!-- Search: candidates arriving, with scores and reasons -->
      <section class="panel hidden" id="panel-search">
        <h2>Search</h2>
        <div class="big-number"><span id="search-count">0</span> candidates</div>
        <p class="sub" id="search-split"></p>
        <div class="results">
          <span class="label">Best match</span>
          <table class="values" id="search-best"></table>
        </div>
        <p class="hint" id="search-progress"></p>
        <button class="primary" id="to-model" disabled>Open in editor →</button>
      </section>

      <!-- Edit: 3D result, named parameters, downloads -->
      <section class="panel hidden" id="panel-edit">
        <h2>Design parameters</h2>
        <p class="hint" id="model-source"></p>
        <div class="sliders" id="sliders"></div>
        <p class="hint" id="model-status"></p>
        <button id="reset-parameters">Reset values</button>
        <span class="label">Export</span>
        <div class="exports">
          <button data-format="step"><strong>STEP</strong><span>solid for CAD</span></button>
          <button data-format="stl"><strong>STL</strong><span>mesh for printing</span></button>
          <button data-format="py"><strong>.py</strong><span>CadQuery program</span></button>
        </div>
        <p class="hint" id="download-status"></p>
      </section>
    </aside>
  </div>

  <script type="module" src="/static/app.js"></script>
</body>
</html>
